[env:cyd2usb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCYD_PANEL_ST7789=1
    -DCYD_INVERT=0
    -DCORE_DEBUG_LEVEL=1
    ; WebServer: Multipart-Formulare (die der Core vor jeder Schlüsselprüfung selbst liest) klein halten.
    ; Das WLAN-Portal schickt sein Formular ohne Multipart und ist davon nicht betroffen.
    -DWEBSERVER_MAX_POST_ARGS=4
    -DWEBSERVER_MAX_POST_ARG_LEN=512
lib_deps =
    lovyan03/LovyanGFX@1.2.34
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@^7
    olikraus/U8g2@2.36.18

; Versuch mit 80 MHz SPI-Takt zum Display (Standard bleibt 40). Nur zum Testen am Gerät, nicht veröffentlichen.
[env:cyd2usb_spi80]
extends = env:cyd2usb
build_flags =
    ${env:cyd2usb.build_flags}
    -DCYD_SPI_WRITE_MHZ=80

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Isrc
test_build_src = no
